<!-- Header Section -->
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold text-primary">
            <i class="bi bi-question-circle me-2"></i>Frequently Asked Questions
        </h1>
        <p class="lead text-muted">Common questions about using this system</p>
    </div>

    <!-- FAQ List -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div *ngFor="let faq of faqs; let i = index" class="card border shadow-sm mb-3">
                <div class="card-header bg-white py-3" style="cursor: pointer;" (click)="toggleQuestion(i)">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="mb-0 fw-bold">
                            <i class="bi bi-patch-question text-primary me-2"></i>{{faq.question}}
                        </h6>
                        <i class="bi" [ngClass]="faq.isOpen ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                    </div>
                </div>
                <div class="card-body" *ngIf="faq.isOpen">
                    <p class="text-muted mb-0">
                        <i class="bi bi-arrow-return-right text-success me-2"></i>{{faq.answer}}
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Help Section -->
    <div class="row justify-content-center mt-5">
        <div class="col-lg-6">
            <div class="card border text-center p-4 bg-light">
                <i class="bi bi-envelope text-primary mb-2" style="font-size: 2.5rem;"></i>
                <h5 class="fw-bold">Still Have Questions?</h5>
                <p class="text-muted small mb-0">Contact the developer for more help</p>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="py-4 border-top">
    <div class="container text-center">
        <div class="mb-2">
            <i class="bi bi-person-circle text-primary me-2" style="font-size: 1.5rem;"></i>
            <span class="fw-bold">Developed by Nimsika Bosilu</span>
        </div>
        <p class="text-muted small mb-0">Employee Management System - Academic Project © 2024-2026</p>
    </div>
</footer>
