<div class="container">
    <div class="row mt-5">
        <div class="col col-sm-12 col-lg-6 mt-5">
            <img src="customer-reg-img.png" width="60%">
        </div>
        <div class="col col-sm-12 col-lg-6 mt-5">

            <form #empForm="ngForm">

                <div class="mb-3 w-50">
                    <label for="first-name" class="form-label">First Name</label>
                    <input [(ngModel)]="employee.firstName" name="firstName" type="text" class="form-control"
                        #firstNameRef="ngModel" required id="first-name" placeholder="Enter First Name">

                    <div *ngIf="firstNameRef.invalid && (firstNameRef.touched || firstNameRef.dirty)"
                        class="text-danger">
                        * First Name is required
                    </div>
                </div>

                <div class="mb-3 w-50">
                    <label for="last-name" class="form-label">Last Name</label>
                    <input [(ngModel)]="employee.lastName" name="lastName" type="text" class="form-control"
                        #lastNameRef="ngModel" required id="last-name" placeholder="Enter Last Name">

                    <div *ngIf="lastNameRef.invalid && (lastNameRef.touched || lastNameRef.dirty)" class="text-danger">
                        * Last Name is required
                    </div>
                </div>

                <div class="mb-3 w-50">
                    <label for="email" class="form-label">Email address</label>
                    <input [(ngModel)]="employee.email" name="email" type="email" class="form-control"
                        #emailRef="ngModel" required email id="email" placeholder="something@example.com">

                    <div *ngIf="emailRef.invalid && (emailRef.touched || emailRef.dirty)" class="text-danger">
                        * Valid Email is required
                    </div>
                </div>

                <div class="mb-3 w-50">
                    <div class="input-group mb-3">
                        <label class="input-group-text" for="department">Department</label>
                        <select [(ngModel)]="employee.departmentId" name="departmentId" class="form-select"
                            id="department">
                            <option *ngFor="let dep of departmentList" [value]="dep.id">
                                {{ dep.name }}
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mb-3 w-50">
                    <div class="input-group mb-3">
                        <label class="input-group-text" for="role">Role</label>
                        <select [(ngModel)]="employee.roleId" name="roleId" class="form-select"
                            [disabled]="!employee?.departmentId" id="role">
                            <option *ngFor="let role of roleList" [value]="role.id">
                                {{ role.name }}
                            </option>
                        </select>
                    </div>
                </div>

                <button id="btn-submit" (click)="addEmployee()" type="button" class="btn btn-primary">Submit</button>

            </form>

        </div>
    </div>
</div>
